<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Mini CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-50/30 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white border border-slate-200/90 rounded-2xl shadow-xl shadow-slate-200/50 p-8 relative overflow-hidden">
    <!-- Decorative top accent line -->
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500"></div>

    <!-- Header -->
    <div class="text-center mb-8 pt-2">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl shadow-md shadow-blue-500/25 mb-3 text-white">
        <i class="fa-solid fa-chart-line text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">ClientPulse CRM</h1>
      <p class="text-slate-500 text-sm mt-1">Lead Management & Conversion System</p>
    </div>

    <!-- Error Alert Box -->
    <div id="errorAlert" class="hidden mb-6 p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-sm flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation flex-shrink-0 text-rose-500"></i>
      <span id="errorMessage">Invalid credentials</span>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Admin Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input 
            type="email" 
            id="email" 
            required
            value="admin@crm.com"
            placeholder="admin@crm.com" 
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-900 placeholder-slate-400 font-medium"
          >
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Password</label>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input 
            type="password" 
            id="password" 
            required
            value="admin123"
            placeholder="••••••••" 
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-900 placeholder-slate-400 font-medium"
          >
        </div>
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-md shadow-blue-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer text-sm"
      >
        <span>Sign In to Dashboard</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <!-- Quick Demo Info -->
    <div class="mt-6 pt-5 border-t border-slate-100 text-center space-y-3">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50/80 border border-blue-100 text-xs text-blue-800">
        <i class="fa-solid fa-key text-blue-600"></i>
        <span>Default: <b>admin@crm.com</b> / <b>admin123</b></span>
      </div>
      <div>
        <a href="/contact" class="text-xs text-blue-600 hover:text-blue-800 font-medium transition inline-flex items-center gap-1.5">
          <span>Go to Public Website Contact Form</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
        </a>
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
